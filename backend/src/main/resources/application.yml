spring:
  application:
    name: udyam-backend
  config:
    import: classpath:recommendation-templates.yml   # Phase 3 recommendation templates + quantity rules
  # Credentials come from env vars (DB_URL / DB_USERNAME / DB_PASSWORD)
  # or from the git-ignored application-local.yml (profile "local").
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000   # Neon free tier sleeps when idle; first connect can be slow
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB          # KYC uploads: KycService enforces the real 5 MB limit with a clear error
      max-request-size: 7MB

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  data-dir: ../data               # resolved relative to the working directory (backend/)
  reference-date: 2026-07-15      # treat as "today" for all date checks (data/README.md)
  cors:
    allowed-origins:
      - http://localhost:5173
  pricing:
    mode: MIN                     # MIN = catalogue price_min (digital price); MID = (min+max)/2 rounded half-up
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${INTERNAL_TOKEN:}     # shared secret with ai-service (set in application-local.yml or env)
    timeout-ms: 45000
  kyc:
    temp-dir: ${KYC_TEMP_DIR:}    # empty = {java.io.tmpdir}/udyam-kyc; uploads are deleted right after extraction
    max-upload-bytes: 5242880     # 5 MB, same as the ai-service
    retention-days: 2555          # extracted fields kept "as required by law" (shown in the consent notice)
    notice-version: 2026-07-v1
    fixture-cache: ${KYC_FIXTURE_CACHE:false}   # DEV ONLY: specimen uploads reuse golden fixtures (no Gemini call)
    fixture-dir: src/test/resources/kyc/fixtures
    specimen-dir: ../data/kyc_documents
    expected-verdicts: src/test/resources/kyc/expected-verdicts.json
